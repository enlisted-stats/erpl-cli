<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>{{.Style}}</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="title">
      <h1 id="mission"></h1>
      <p id="subtitle"></p>
    </div>
    <div id="result"></div>
    <div id="teams"></div>
    <button id="theme" class="iconbtn"></button>
  </header>
  <main id="view">
    <canvas id="map"></canvas>
    <div id="tip" role="tooltip"></div>
    <section id="card" hidden></section>
    <div id="scale"></div>
    <div class="zoom">
      <button id="zoomIn"></button>
      <button id="zoomOut"></button>
      <button id="zoomFit"></button>
    </div>
  </main>
  <aside id="panel">
    <div class="block" id="filters"></div>
    <div class="block" id="layers"></div>
    <div class="block grow" id="lists"></div>
  </aside>
  <section id="strip">
    <div id="stripHead"></div>
    <canvas id="timeline"></canvas>
  </section>
</div>
<script id="data" type="application/json">{{.Data}}</script>
<script>{{.Script}}</script>
</body>
</html>
